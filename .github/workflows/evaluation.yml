name: Support Agent Evaluation

on:
  push:
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create results directory
        run: |
          mkdir -p results

      - name: Build retrieval index
        run: |
          python src/build_index.py \
            --input data/amazon_cases.csv \
            --out data/retrieval_index.joblib

      - name: Run intent evaluation
        run: |
          python src/evaluate_intent.py \
            --golden data/golden_set.csv \
            --out results/intent_results.json

      - name: Run agent evaluation
        run: |
          python src/evaluate_agent.py \
            --golden data/golden_set.csv \
            --out results/agent_results.json

      - name: Run reply evaluation
        run: |
          python src/evaluate_reply.py \
            --golden data/golden_set.csv \
            --out results/reply_results.json